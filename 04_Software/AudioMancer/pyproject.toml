[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiomancer"
version = "1.1.4"
description = "AudioMancer desktop audiobook production application scaffold."
readme = "README.MD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7.0",
    "PyMuPDF>=1.25,<2.0",
    "langdetect>=1.0.9,<2.0",
    "python-docx>=1.1,<2.0",
    "striprtf>=0.0.29,<1.0",
    "odfpy>=1.4.1,<2.0",
    "EbookLib>=0.18,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "PyInstaller>=6.0,<7.0",
    "ruff>=0.15.10",
]

[project.scripts]
audiomancer = "audiomancer.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
audiomancer = ["assets/icons/*.ico", "assets/icons/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "service: fast non-Qt service and logic tests",
    "ui: Qt widget, controller, and main-window tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax for py312)
    "B",   # flake8-bugbear (common bugs and design issues)
    "C4",  # flake8-comprehensions (unnecessary comprehensions)
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary expressions — kept explicit for readability
]

[tool.ruff.lint.isort]
known-first-party = ["audiomancer"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
