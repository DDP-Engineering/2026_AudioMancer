[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiomancer"
version = "0.1.13"
description = "AudioMancer desktop audiobook production application scaffold."
readme = "README.MD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7.0",
    "PyMuPDF>=1.25,<2.0",
    "langdetect>=1.0.9,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "PyInstaller>=6.0,<7.0",
]

[project.scripts]
audiomancer = "audiomancer.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
