# AEGIS Light configuration. Written once by `aegis init` and yours from
# then on - upgrades never overwrite this file.

schema = 1

[commands]
# The application lives in 05_Software/AudioMancer and runs through uv.
# The full suite changes directory so pytest picks up `testpaths` from the
# application's pyproject.toml.
test = "cd 05_Software/AudioMancer && uv run pytest -q"
# The impacted set must NOT change directory: AEGIS substitutes
# repository-root-relative selectors into {tests}, and a `cd` would make
# pytest resolve them a second time against the application folder
# (05_Software/AudioMancer/05_Software/AudioMancer/tests/...). `--project`
# selects the application's environment without moving the working
# directory, and pytest still infers the application as its rootdir from
# the selector paths, so `pythonpath` and `testpaths` keep working.
test_impacted = "uv run --project 05_Software/AudioMancer pytest -q {tests}"
# Repository audits from 02_Tools/audits, scoped to the files this task
# changed so the advisory report stays proportionate. Drop --changed-only to
# audit the whole application subtree.
codestyle = "python 02_Tools/audits/audit_codestyle.py --changed-only"
logging_coverage = "python 02_Tools/audits/audit_logging_coverage.py --changed-only"

[timeouts]
# Seconds allowed for one named command. Nothing shipped carries a limit, so
# only the full suite is bounded here; the fast audits run unbounded. The full
# AudioMancer suite takes at most 60 minutes, so it is capped at exactly that.
# A run that exceeds the cap is reported as proving nothing - never as a
# failure - so raise this line if the suite legitimately grows past an hour.
test = 3600

[layout]
# Globs used by the traceability heuristics of `aegis check`.
source = ["05_Software/AudioMancer/src/"]
tests = ["05_Software/AudioMancer/tests/"]

[check]
secret_patterns_extra = []
ignore = ["**/.venv/**"]
strict_promote = []
# run = ["test"]   # restrict what `check --run` executes; without this,
#                  # side-effect-looking names are skipped
