[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-workflow-template"
version = "0.1.0"
description = "Manual agentic development workflow template"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentic-workflow = "agentic_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
