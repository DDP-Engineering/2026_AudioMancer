# Build metadata for the embedded workflow CLI copied into target projects.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Project metadata for the optional local install under `.agentic/.venv`.
[project]
name = "agentic-workflow-template"
version = "0.1.0"
description = "Manual agentic development workflow template"
requires-python = ">=3.11"
dependencies = []

# Console entry point created by the optional local install scripts.
[project.scripts]
agentic-workflow = "agentic_workflow.cli:main"

# Package discovery for the embedded source tree.
[tool.setuptools.packages.find]
where = ["src"]

# Test defaults for projects that keep CLI tests alongside the embedded copy.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
