# Manual workflow policy. V1 is deliberately human-steered.

[manual_gates]
intake = "stop"
requirement = "stop"
check = "stop"
implementation = "stop"
validation = "stop"
delivery = "stop"

[asks]
clarify = "ask"
review = "ask"
decide = "ask"
approve = "ask"
notify = "report"

[invariants]
INV-1 = "blocking"
INV-2 = "blocking"
INV-3 = "blocking"
INV-4 = "blocking"
INV-5 = "advisory"
INV-6 = "blocking"
INV-7 = "non-waivable"
