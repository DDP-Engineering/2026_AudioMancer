# Complete AEGIS workflow configuration. Repository policy is explicit: the
# shipped template is unrestricted/disabled until an operator opts into rules.
schema_version = 3

# Optional AEGIS quick-run advisory. Omission is equivalent to disabled mode
# with max_paths = 10 and preserves compatibility with schema-3 deployment
# tooling that recognizes only the original tables. Uncomment to opt in:
# [quick.changed_paths]
# mode = "advise"
# max_paths = 10

[source]
roots = ["04_Software/AudioMancer/src/audiomancer"]

[tests]
roots = ["04_Software/AudioMancer/tests"]

[requirements]
roots = [".agentic/requirements"]

[documentation]
roots = [".agentic/knowledge/components"]
component_template = ".agentic/knowledge/components/component_template.md"

[components]
manifest = ".agentic/components.toml"

[components.baseline_guard]
mode = "disabled"

[knowledge]
roots = [".agentic/knowledge"]

[reports]
adoption_root = ".agentic/reports/adoption"

[traceability]
language = "python"
source_extensions = [".py"]
test_file_patterns = ["test_*.py", "*_test.py"]

[traceability.coverage]
mode = "enforce"
coverable_roots = ["04_Software/AudioMancer/src/audiomancer"]
exclude = ["**/__init__.py"]

[adoption]
allow_component_bundles = true
max_bundle_components = 5

[adoption.source_changes]
mode = "blocked"

[alignment]
enabled = true
pause_on_open_questions = true
risk_threshold = "medium"
allow_recommended_responses = true

[alignment.protected_scope]
mode = "disabled"
patterns = []

[interface]
stage_form_retention = "versioned"
check_execution = "external"

[gates.build]
mode = "disabled"
commands = []

[gates.typecheck]
mode = "disabled"
commands = []

[gates.lint]
mode = "enforce"
commands = ["uv run --directory 04_Software/AudioMancer ruff check ."]

[gates.test]
mode = "enforce"
commands = ["uv run --directory 04_Software/AudioMancer python -m pytest -q"]
timeout = 1800

[gates.security]
mode = "disabled"
commands = []

[guardrails.secrets]
mode = "enforce"
patterns = ["sk-[A-Za-z0-9_-]{20,}", "ghp_[A-Za-z0-9_]{20,}", "AKIA[0-9A-Z]{16}", "-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----"]

[guardrails.protected_paths]
mode = "disabled"
patterns = []
operations = []

[guardrails.working_tree]
mode = "unrestricted"
blocked_patterns = []

[guardrails.write_access]
mode = "unrestricted"

[guardrails.scope]
mode = "unrestricted"
allowed_roots = []

[guardrails.delivery]
mode = "disabled"
command_patterns = []
