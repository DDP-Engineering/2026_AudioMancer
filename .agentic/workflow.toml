# Generic workflow configuration. Adjust these paths for each target repo.

[source]
# Implementation roots used by invariants, impact analysis, and scope checks.
roots = ["04_Software/AudioMancer"]

[tests]
# Test roots used by traceability checks and linked-test resolution.
roots = ["04_Software/AudioMancer/tests"]

[requirements]
# Durable requirement register roots. Markdown files here are parsed as the
# long-lived behavior and verification source of truth.
roots = [".agentic/requirements"]

[documentation]
# Component documentation roots. Implementation work should update the matching
# component page when behavior, contracts, or responsibilities change.
roots = [".agentic/knowledge/components"]

# Template used when a new component documentation page must be created.
component_template = ".agentic/knowledge/components/component_template.md"

[adoption]
# Default component status required before behavior-changing work should touch a
# mapped existing component.
default_completion_level = "baseline-usable"

# Component bundles are allowed only when explicitly approved in the component
# manifest and kept small enough to review as one local scope.
allow_component_bundles = true
max_bundle_components = 5

# Existing-project adoption records knowledge and tests. Keep application
# behavior changes out of adoption unless a repository deliberately opts in.
behavior_changes_allowed = false

[components]
# Component map used by adoption status, local scope checks, and baseline
# reporting.
manifest = ".agentic/components.toml"

[knowledge]
# Knowledge roots owned by the workflow. Human-facing repository docs may live
# elsewhere.
roots = [".agentic/knowledge"]

[reports]
# Adoption baseline reports and summaries generated by the workflow.
adoption_root = ".agentic/reports/adoption"

[traceability]
# Language-specific resolver used for linked test IDs such as
# `tests/test_feature.py::test_behavior`.
language = "python"

# Source extensions considered by coverable-file discovery.
source_extensions = [".py"]

# Roots where source files require requirement coverage or an explicit waiver.
coverable_roots = ["04_Software/AudioMancer/src/audiomancer"]

# Files or glob patterns excluded from coverable-file discovery.
coverable_exclude = ["__init__.py"]

# Test filename patterns used by local discovery and audit helpers.
test_file_patterns = ["test_*.py", "*_test.py"]

[gates]
# Named command lists run by `aegis gates run`.
# Replace these empty defaults with the target repository's real validation
# commands, for example tests, linting, formatting checks, or documentation
# audits.
test = [["uv", "run", "--project", "04_Software/AudioMancer", "pytest", "-q"]]
lint = [["uv", "run", "--project", "04_Software/AudioMancer", "ruff", "check", "."]]

[secrets]
# Regular expressions scanned during secret checks. Keep this list conservative:
# entries here may block delivery if a matching token-like value is found.
patterns = [
  "sk-[A-Za-z0-9_-]{20,}",
  "ghp_[A-Za-z0-9_]{20,}",
  "AKIA[0-9A-Z]{16}",
  "-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----"
]

[working_tree]
# Ordinary untracked human files are advisory only. Add project-specific
# patterns here when a repository wants delivery preflight to block them.
# Example: ["dist/**", "generated/**", "*.tmp"].
blocked_patterns = []

[alignment]
# First-class intent alignment stage recorded before requirement/spec work.
enabled = true

# Open questions, configured protected paths, or risk at/above the threshold
# require the alignment decision to be "pause". When recommended responses are
# allowed, an automated flow may proceed with questions only if the alignment
# record states the responses it will assume.
pause_on_open_questions = true
risk_threshold = "medium"
allow_recommended_responses = true
protected_scope_patterns = []

[write_zones]
# Stage-specific edit allowlists used by the PreToolUse write-zone hook.
# Patterns are repo-root-relative globs. Empty lists make a stage read-only.
# `repo-wide` access mode bypasses these allowlists but still respects protected
# paths such as `.git/**`, env files, private keys, and certificate bundles.
intake = [".agentic/**"]
alignment = [".agentic/**"]

adoption-intake = [".agentic/**"]
adoption-alignment = [".agentic/**"]
repo-discovery = [".agentic/**"]
component-map = [".agentic/**"]
component-adoption = [".agentic/**", "04_Software/AudioMancer/tests/**"]
baseline-review = [".agentic/**"]
adoption-delivery = [".agentic/**"]

# Requirement stage owns specs and requirement registers only.
requirement = [".agentic/requirements/**"]

# Check stage owns tests only.
check = ["04_Software/AudioMancer/tests/**"]

# Implementation stage owns source roots and component documentation.
implementation = ["04_Software/AudioMancer/**", ".agentic/knowledge/components/**"]

# Validation stage is read-only; record evidence through workflow commands.
validation = []

# Delivery stage may update workflow reports and run metadata.
delivery = [".agentic/**"]
