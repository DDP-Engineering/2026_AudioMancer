# AudioMancer workflow configuration.

[source]
roots = ["04_Software/AudioMancer/src/audiomancer"]

[tests]
roots = ["04_Software/AudioMancer/tests"]

[requirements]
roots = [".agentic/requirements"]

[documentation]
roots = ["05_SoftwareDocu"]
component_template = "05_SoftwareDocu/component_documentation_template.md"

[adoption]
default_completion_level = "baseline-usable"
allow_component_bundles = true
max_bundle_components = 5
behavior_changes_allowed = false

[components]
manifest = ".agentic/components.toml"

[knowledge]
roots = [".agentic/knowledge"]

[reports]
adoption_root = ".agentic/reports/adoption"

[traceability]
language = "python"
source_extensions = [".py"]
coverable_roots = [
  "04_Software/AudioMancer/src/audiomancer/services",
  "04_Software/AudioMancer/src/audiomancer/ui/controllers"
]
coverable_exclude = ["__init__.py"]
test_file_patterns = ["test_*.py", "*_test.py"]

[gates]
test = [
  "04_Software/AudioMancer/.venv/Scripts/python.exe 02_Tools/audits/audit_traceability.py",
  "04_Software/AudioMancer/.venv/Scripts/python.exe 02_Tools/audits/audit_requirement_coverage.py",
  "04_Software/AudioMancer/.venv/Scripts/python.exe -m pytest -q 04_Software/AudioMancer/tests/test_traceability.py"
]
lint = [
  "04_Software/AudioMancer/.venv/Scripts/python.exe 02_Tools/audits/audit_codestyle.py --changed-only"
]

[secrets]
patterns = [
  "sk-[A-Za-z0-9_-]{20,}",
  "ghp_[A-Za-z0-9_]{20,}",
  "AKIA[0-9A-Z]{16}",
  "-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----"
]

[working_tree]
blocked_patterns = []

[alignment]
enabled = true
pause_on_open_questions = true
risk_threshold = "medium"
allow_recommended_responses = true
protected_scope_patterns = []

[write_zones]
# Project policy: normal repository folders are writable in every workflow
# stage. The hook still blocks protected Git, secret, key, and environment files.
intake = ["**"]
alignment = ["**"]

adoption-intake = ["**"]
adoption-alignment = ["**"]
repo-discovery = ["**"]
component-map = ["**"]
component-adoption = ["**"]
baseline-review = ["**"]
adoption-delivery = ["**"]

requirement = ["**"]
check = ["**"]
implementation = ["**"]
validation = ["**"]
delivery = ["**"]
