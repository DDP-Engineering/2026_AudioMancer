# AEGIS workflow configuration for AudioMancer.
# Migrated from schema 1 (AEGIS payload 0.5.0) to schema 2 (payload 1.1.0).
# Structural values and real project policy are preserved; guardrail modes that
# had no schema-1 equivalent use the unrestricted/disabled defaults.
schema_version = 2

[source]
# Implementation roots used by invariants, impact analysis, and scope checks.
roots = ["04_Software/AudioMancer/src/audiomancer"]

[tests]
# Test roots used by traceability checks and linked-test resolution.
roots = ["04_Software/AudioMancer/tests"]

[requirements]
# Durable requirement snapshot roots.
roots = [".agentic/requirements"]

[documentation]
# Component documentation roots and the template used for new component pages.
roots = [".agentic/knowledge/components"]
component_template = ".agentic/knowledge/components/component_template.md"

[components]
# Component map used by adoption status, local scope checks, and reporting.
manifest = ".agentic/components.toml"

[components.baseline_guard]
# No schema-1 equivalent enforced a baseline; keep it disabled.
mode = "disabled"

[knowledge]
# Knowledge roots owned by the workflow.
roots = [".agentic/knowledge"]

[reports]
# Adoption baseline reports generated by the workflow.
adoption_root = ".agentic/reports/adoption"

[traceability]
# Language-specific resolver used for linked test IDs.
language = "python"
source_extensions = [".py"]
test_file_patterns = ["test_*.py", "*_test.py"]

[traceability.coverage]
# Preserves the schema-1 coverable-roots configuration.
mode = "enforce"
coverable_roots = ["04_Software/AudioMancer/src/audiomancer"]
exclude = ["**/__init__.py"]

[adoption]
allow_component_bundles = true
max_bundle_components = 5

[adoption.source_changes]
# Preserves schema-1 `behavior_changes_allowed = false`.
mode = "blocked"

[alignment]
enabled = true
pause_on_open_questions = true
risk_threshold = "medium"
allow_recommended_responses = true

[alignment.protected_scope]
mode = "disabled"
patterns = []

[gates]
# Named command lists run by `aegis gates run`.
# `--directory` (not `--project`) is required: it changes the working directory
# so `04_Software/AudioMancer/pyproject.toml` is picked up as the pytest/ruff
# config file. With `--project` the tools run from the repository root, where
# testpaths, `addopts = -m 'not performance'`, and the registered markers are
# all silently ignored.
mode = "enforce"
test = ["uv run --directory 04_Software/AudioMancer pytest -q"]
lint = ["uv run --directory 04_Software/AudioMancer ruff check ."]

[guardrails.secrets]
# Regular expressions scanned during secret checks (preserved from schema 1).
mode = "enforce"
patterns = [
  "sk-[A-Za-z0-9_-]{20,}",
  "ghp_[A-Za-z0-9_]{20,}",
  "AKIA[0-9A-Z]{16}",
  "-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----",
]

[guardrails.protected_paths]
mode = "disabled"
patterns = []
operations = []

[guardrails.working_tree]
# Schema-1 blocked_patterns was empty.
mode = "unrestricted"
blocked_patterns = []

[guardrails.write_access]
# Schema-1 write_zones were being opened to `**`; unrestricted matches that intent.
mode = "unrestricted"

[guardrails.scope]
mode = "unrestricted"
allowed_roots = []

[guardrails.delivery]
mode = "disabled"
command_patterns = []
