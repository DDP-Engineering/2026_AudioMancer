  "04_Software/AudioMancer/tests/test_misc_ui_controller.py::test_create_progress_dialog_applies_window_language_before_start",
  "04_Software/AudioMancer/tests/test_misc_ui_controller.py::test_create_progress_dialog_defaults_to_english_without_settings_payload",
]

priority = "high"
rationale = """
Operators must receive the selected language in every operation-progress surface, including dialogs created through production callers.
"""
