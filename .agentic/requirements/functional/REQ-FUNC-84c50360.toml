schema = 1
id = "REQ-FUNC-84c50360"
title = "The shared progress-dialog factory shall localize operation progress UI before display"
status = "active"

requirement = """
The shared progress-dialog factory shall resolve the current UI language from the active window settings and apply it to each new operation-progress dialog before the dialog displays its operation title. The dialog shall render its title template, cancel control, and later token-usage text in that language, retain English behavior for English settings, preserve caller-supplied operation names and status messages, and continue to support runtime language changes for an existing dialog.
"""

verification = "Automated: the shared factory creates a Romanian dialog whose title and cancel control are localized before start and whose later token-usage text is Romanian; direct dialog coverage verifies runtime language changes, and English factory settings retain English text."

affected_paths = [
  "04_Software/AudioMancer/src/audiomancer/ui/operation_progress_dialog.py",
  "04_Software/AudioMancer/src/audiomancer/ui/controllers/misc_ui_controller.py",
]
linked_tests = [
