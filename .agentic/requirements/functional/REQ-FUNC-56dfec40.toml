title = "Text Chunking state notes shall truthfully present persisted lifecycle status and durable notes"
status = "active"

requirement = """
Text Chunking state shall derive page notes from the authoritative Chunking document through its production state-builder path. Running documents shall show an in-progress note without fabricated numeric progress; failed and cancelled documents shall show the appropriate resume note while retaining persisted warnings and AI token usage; completed documents shall show the completed summary and rerun warning; and absent documents shall retain ready and profile guidance. AI-assisted lifecycle notes shall use the semantic strategy stored in the authoritative document.
"""

