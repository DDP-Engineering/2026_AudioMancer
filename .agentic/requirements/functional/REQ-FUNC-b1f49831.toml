id = "REQ-FUNC-b1f49831"
title = "Source replacement shall preserve one consistent project state"
status = "active"

requirement = """
Replacing an unlocked project's registered source shall copy the new source before deleting the previous stored source, store the new source under a name that cannot collide with a reserved generated artifact, and only after a successful copy invalidate Extraction and every downstream artifact and compact operation summary. The completed replacement shall register the new source, set current_stage to source_selected, and preserve the project's target-language, selected-voice-language, and voice-assignment options. A copy failure shall leave the previous source, manifest, generated artifacts, and operation summaries unchanged.
"""

verification = "Automated service and Home-controller regressions confirm copy-first replacement, reserved-name storage, complete downstream invalidation, option preservation, and an unchanged prior project after an injected copy failure."

