title = "Validate and recover Book Analysis model response formats"
status = "active"
requirement = """
When a Book Analysis leaf, consolidation or final report response has invalid fields or types,
AudioMancer shall regenerate it once from the original evidence using the same profile and language,
then either accept the validated result or report a model-response format error while preserving
valid checkpoints and completed reports. Every request includes the canonical JSON schema in its
prompt, independent of provider enforcement. Prompt budgets include schema and correction overhead,
including on resume without enlarging a previously reduced source allowance. Successful recovery
combines both responses' usage. Cancellation and transport failures do not trigger format retries.
"""
verification = "Scripted-provider tests exercise all three phases, wrong-shaped valid JSON, schema text parity, bounded retries, cancellation, transport failure and failed-checkpoint preservation; Book Analysis regression modules cover resume and document validation."
