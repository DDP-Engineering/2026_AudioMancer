requirement = """
The operator-selectable narration block target shall only shorten blocks, never exceed the TTS model token budget.

Retired 2026-08-20: the narration block target control is removed. Because it could only shorten and the model budget capped it, every value at or above the model's own block duration behaved identically to Auto, and no value below it improved on Auto.
"""

verification = "Inspection: confirm the narration block target control, its configuration constants, its persisted setting and its budget-narrowing helpers are absent from the current implementation."

