requirement = """
Selecting a ChatGPT subscription model shall apply its catalog-reported default context window, retain later manual edits across refresh and settings reload, and reset that override when another model is selected. Unknown defaults retain the current value; automatic model selection for local/custom endpoints leaves their user-configured context unchanged.
"""

