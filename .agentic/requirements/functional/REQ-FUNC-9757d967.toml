# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-9757d967"

title = "Canonicalize VoiceWeaver discovered models once"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When VoiceWeaver discovered-model data crosses the runtime or settings boundary, AudioMancer shall canonicalize it through the same public service-owned contract without mutating caller-owned input, and shall discard a persisted model inventory that declares a generation mode the current runtime contract does not define rather than reporting capabilities derived from it.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "A deliberately messy model produces the same canonical payload through runtime probing and settings validation, including normalized range/default metadata and status, with only scalar model parameters retained and the original nested input unchanged and unaliased; a persisted inventory declaring an undefined generation mode leaves settings with no cached models, no active model, and the connection reported as untested."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/settings_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/voiceweaver_runtime_service.py",
  "05_Software/AudioMancer/src/audiomancer/ui/controllers/tts_runtime_ui_support.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_settings_service.py::test_validate_settings_uses_canonical_voiceweaver_model_normalization_without_aliases",
  "05_Software/AudioMancer/tests/test_tts_runtime_ui_support.py::test_probe_runtime_cache_save_preserves_discovered_model_ranges",
  "05_Software/AudioMancer/tests/test_voiceweaver_runtime_service.py::test_read_status_filters_non_scalar_effective_parameters_without_mutating_input",
  "05_Software/AudioMancer/tests/test_settings_service.py::test_validate_settings_discards_a_model_cache_carrying_unknown_generation_modes",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"
rationale = "A single owner prevents persisted settings from drifting from the runtime discovery contract."

created = 2026-08-09
updated = 2026-08-22
