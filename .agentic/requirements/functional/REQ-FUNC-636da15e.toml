id = "REQ-FUNC-636da15e"
title = "Configure and probe VoiceWeaver through the simplified connection contract"
status = "active"

requirement = """
When an operator configures and tests the VoiceWeaver connection by base URL, AudioMancer shall derive the normalized model inventory, active model, reported runtime version, and capability matrix from `GET /models` followed by `GET /status`, and shall report a refusal using the runtime's own error message rather than the bare status code.
"""

verification = "Focused settings and runtime tests exercise the base-URL connection form, record the two probe URLs, return representative model and status payloads, and observe the normalized probe result, including the reported runtime version on success and the runtime's own error message when the runtime refuses with an error envelope."

