# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-46959c54"

title = "Each generation request shall carry a token ceiling large enough for the text it sends"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When Audio Blocks sends one text part for speech generation, the generation-token ceiling accompanying that request shall be the operator's configured target for a part that fits within it, and for a longer part the smallest ceiling that covers the part's estimated spoken length, never above the maximum the runtime reports the model will accept.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "A focused test drives Audio Blocks generation with a recording runtime stub over a block whose single sentence exceeds the operator target, and observes the recorded request carrying a max_new_tokens above the operator target, no higher than the reported model maximum, and covering the part's estimated length; a block under the target in the same run observes max_new_tokens equal to the operator target."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/audio_blocks_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/tts_budget_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_audio_blocks_service.py::test_generation_request_raises_the_token_ceiling_for_an_over_target_part",
  "05_Software/AudioMancer/tests/test_audio_blocks_service.py::test_generation_request_keeps_the_operator_ceiling_for_a_part_within_target",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = """
The runtime stops generating at the ceiling it is handed, whether or not the text is finished. Once a part is allowed to run past the operator's target, sending that target as the ceiling would truncate exactly the long sentences the splitter went out of its way to keep intact, turning an audible seam into missing words. Sizing the ceiling to the part rather than raising it for every request keeps the operator's target in force wherever it can be honoured, so a short block is still bounded by it.
"""

created = 2026-08-20
updated = 2026-08-20
