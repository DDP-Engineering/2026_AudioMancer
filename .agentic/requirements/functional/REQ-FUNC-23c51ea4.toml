id = "REQ-FUNC-23c51ea4"
title = "The provider client shall reject empty or refused assistant content without repair"
status = "active"

requirement = """
When the first provider choice contains empty or null assistant content, the provider client shall fail after exactly one provider request without model-based JSON repair. Null multipart text fields count as empty, valid multipart text remains usable, and reasoning-only content is not JSON content. A non-empty refusal string produces a clear refusal ValueError; otherwise the client preserves its generic empty-response ValueError. Explicit finish_reason="length" rejection remains higher priority, and errors and transaction logs must not expose profile credentials or other secrets.
"""

verification = "Automated: null content with and without refusal, reasoning-only content, mixed null/valid multipart content, valid multipart content, and output-length responses demonstrate exactly one request for every empty/refused case, refusal-specific or generic safe errors as appropriate, unchanged valid text parsing, and unchanged output-limit precedence."

affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/llm_provider_service.py",
]
linked_tests = [
