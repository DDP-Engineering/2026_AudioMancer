# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-18168ed4"

title = "The provider client shall retain compatibility adaptations across outer retries"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When a provider rejects response_format or requires max_completion_tokens and the applicable fallback is permitted, the provider client shall retain the adapted request shape for all remaining outer attempts in the current chat_json invocation. Compatibility adaptation is immediate and does not consume or expand the configured outer retry count; already-learned adaptations and their fallback log records are not repeated; permanent failures remain non-retryable; unconstrained fallback and schema contracts remain enforced; and a separate invocation starts from its own original payload.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Automated: exact captured request sequences show response_format removal and max_completion_tokens substitution surviving a later transient failure, permanent and fallback-disabled failures stopping without outer retry expansion, a single truthful response-format fallback record, and a separate invocation resetting compatibility state."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/llm_provider_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_retains_response_format_fallback_across_outer_retries",
  "05_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_retains_max_completion_tokens_across_outer_retries",
  "05_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_does_not_fallback_when_unconstrained_output_is_disabled",
  "05_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_resets_response_format_compatibility_for_separate_calls",
  "05_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_does_not_retry_permanent_http_failure",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = "specs/REQ-FUNC-18168ed4.md"

priority = "high"   # low | normal | high
rationale = "Call-local capability learning avoids guaranteed incompatible requests while preserving explicit per-call policy and retry limits."

created = 2026-08-05
updated = 2026-08-05
