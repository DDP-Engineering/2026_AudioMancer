title = "Cleanup shall reject newly introduced rendered alphanumeric fusion"
status = "active"

requirement = """
When rendering places alphanumeric endpoints from separate retained source spans directly beside each other, Cleanup shall reject the result unless that exact join removed the left rendered span's source-terminal hyphen through an applicable dehyphenation decision.
"""

verification = "Rendered-span tests distinguish ordinary separators, preserved punctuation and hyphens, and applicable dehyphenation from unauthorized direct and dropped-unit adjacency, with unsafe renders raising CleanupRenderError before publication."

