# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-32f94a76"

title = "Character Discovery shall persist completed-window progress"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When Character Discovery saves or resumes a compatible checkpoint, the service
shall persist and report the real discovery-window completed/planned counts
independently of the next source-chunk cursor and synthesis candidate cursor.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Service, state, controller, page, and manifest tests cancel and resume a budget-shaped window plan near source chunk 40, prove the persisted completed-window count is retained across discovery cancellation, provider failure, synthesis transition, and repeated resume, and prove callbacks, operation summaries, and page notes report windows separately from chunks and candidates."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/character_discovery_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/character_discovery_state_service.py",
  "05_Software/AudioMancer/src/audiomancer/ui/controllers/characters_ui_controller.py",
  "05_Software/AudioMancer/src/audiomancer/ui/pages/characters_page.py",
  "05_Software/AudioMancer/tests/test_character_discovery_service.py",
  "05_Software/AudioMancer/tests/test_character_discovery_state_service.py",
  "05_Software/AudioMancer/tests/test_characters_page.py",
  "05_Software/AudioMancer/tests/test_characters_ui_controller.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_character_discovery_service.py::test_discovery_resume_persists_real_window_progress_before_synthesis",
  "05_Software/AudioMancer/tests/test_character_discovery_service.py::test_resume_state_keeps_window_counts_separate_from_chunk_cursor",
  "05_Software/AudioMancer/tests/test_character_discovery_service.py::test_character_discovery_strictly_rejects_new_profile_and_window_contract_fields",
  "05_Software/AudioMancer/tests/test_character_discovery_service.py::test_discovery_resume_provider_failure_preserves_current_inventory",
  "05_Software/AudioMancer/tests/test_character_discovery_state_service.py::test_character_state_recovers_from_invalid_last_used_profile_field",
  "05_Software/AudioMancer/tests/test_characters_ui_controller.py::test_character_operation_summary_does_not_reload_source_chunks",
]

