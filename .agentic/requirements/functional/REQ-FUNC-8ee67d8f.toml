# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = """
The runtime's recommended maximum is a ceiling it will attempt, not a quality guarantee: cloned voices drift audibly toward the end of a block generated near it. The operator hears that drift and the runtime cannot report it, so the choice of how far below the ceiling to plan belongs to the operator. It only ever lowers, because planning above what the model reports yields truncated or silent audio.
"""

created = 2026-08-20
updated = 2026-08-20
