  "04_Software/AudioMancer/src/audiomancer/services/narrator_definition_state_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "04_Software/AudioMancer/tests/test_tts_budget_service.py::test_operator_token_maximum_lowers_the_runtime_reported_budget",
  "04_Software/AudioMancer/tests/test_tts_budget_service.py::test_operator_token_maximum_never_raises_the_runtime_reported_budget",
  "04_Software/AudioMancer/tests/test_tts_budget_service.py::test_generation_token_limit_falls_back_to_the_shipped_default",
  "04_Software/AudioMancer/tests/test_tts_settings_page.py::test_tts_settings_page_round_trips_the_max_block_tokens_setting",
