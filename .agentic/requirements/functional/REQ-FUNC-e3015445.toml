title = "Character discovery shall validate Unicode manual character names"
status = "active"

requirement = """
When an operator adds or edits a character, Character Discovery shall retain a
stripped meaningful Unicode-letter-or-number display name and reject an invalid
or identity-equivalent canonical name or alias using Unicode-aware comparison.
"""

