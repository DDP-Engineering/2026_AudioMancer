schema = 1
id = "REQ-FUNC-35098598"
title = "Persist Speech Block warning cleanup only on successful save"
status = "active"

requirement = """
When an operator enters, cancels, or unsuccessfully saves a Speech Block edit,
the controller shall leave persisted warning flags unchanged so that only a
successful authoritative block update clears them.
"""

verification = "Controller and service-spy regressions open a warned block without persistence or review-summary refresh, decline edit entry and fail a save without clearing warnings, then commit a valid edit and observe warning cleanup through update_speech_block only."

