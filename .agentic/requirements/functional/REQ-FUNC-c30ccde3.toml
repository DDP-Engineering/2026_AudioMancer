# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-c30ccde3"

title = "Whitespace-only Cleanup edits preserve only unambiguous paragraph provenance"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When a whitespace-only manual edit rebuilds Cleanup paragraphs, Cleanup shall preserve source provenance only for a unique one-to-one normalized-content match to a prior paragraph whose provenance is explicitly available and nonempty.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Focused edit tests show paragraph-local source identifiers and metadata survive only unique truthful matches, while merged, split, unmatched, duplicate, and lexical-edit paragraphs expose unavailable empty provenance without role, warning, chunking, or offset regressions."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "04_Software/AudioMancer/src/audiomancer/services/text_cleanup_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "04_Software/AudioMancer/tests/test_cleanup_service.py::test_whitespace_merge_split_preserves_narratable_prose",
  "04_Software/AudioMancer/tests/test_cleanup_service.py::test_whitespace_role_realign_falls_back_for_ambiguous_content",
  "04_Software/AudioMancer/tests/test_cleanup_service.py::test_whitespace_realign_carries_unique_paragraph_metadata_and_warnings",
  "04_Software/AudioMancer/tests/test_cleanup_quality_contract.py::test_manual_whitespace_and_lexical_edits_keep_truthful_structure",
  "04_Software/AudioMancer/tests/test_cleanup_quality_contract.py::test_user_edited_cleanup_reclassifies_only_explicit_scene_separators",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = "specs/REQ-FUNC-c30ccde3.md"

priority = "high"
rationale = """
Paragraph provenance is durable metadata consumed by downstream workflows, so conservative loss is safer than assigning unrelated source units or inventing page and transition history.
"""

created = 2026-08-07
updated = 2026-08-07
