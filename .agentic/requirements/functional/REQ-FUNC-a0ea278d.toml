schema = 1
id = "REQ-FUNC-a0ea278d"
title = "Token usage normalization shall preserve usable provider counters"
status = "active"

requirement = """
When provider or persisted usage contains valid input and output token counts, token usage normalization shall return the unchanged durable canonical shape, deriving total tokens only when that field is absent or null and preserving a valid provider-reported total otherwise. Non-negative integers, numeric integer strings, and finite integral non-negative floats are valid; booleans, negatives, fractional or non-finite floats, malformed strings, and present invalid totals are invalid. Missing or invalid input or output counts remain unavailable rather than being invented, and normalization, coercion, merge, and restore operations remain consistent.
"""

verification = "Automated: parameterized normalization and coercion cases cover every accepted and rejected numeric form, absent/null total derivation, preserved provider totals, unavailable partial usage, cumulative merge behavior, ordered restore, and persistence round-trips without changing canonical field names or availability semantics."

