  "04_Software/AudioMancer/tests/test_project_stage_consistency.py::test_lower_requested_stage_does_not_destroy_completed_downstream_work",
  "04_Software/AudioMancer/tests/test_project_stage_consistency.py::test_operation_summary_advances_the_stage",
  "04_Software/AudioMancer/tests/test_project_stage_consistency.py::test_operation_summary_never_moves_the_stage_backwards",
  "04_Software/AudioMancer/tests/test_workflow_controller_service.py::test_sync_manifest_operation_from_disk_ignores_regressing_stage_and_preserves_downstream_summaries",
]

priority = "high"
rationale = """
Speech Blocks writes passed an absolute stage, regressing current_stage to character_voices_ready while audio_blocks and audio_assembly stayed completed. That self-contradiction is what triggers the Repair Project dialog on every later open of a finished project. config.OPERATION_STAGE_BY_KIND documents the stage as the milestone promoted by each completed operation, so it is a high-water mark; lowering it here also risked destroying completed operator work, because invalidation is owned by the explicit downstream-reset path that resets artifacts and summaries together.
"""
