schema = 1
id = "REQ-FUNC-e45d3577"
title = "Operation-summary synchronization shall preserve the project's highest completed workflow stage"
status = "active"

requirement = """
Persisting an operation summary through `project_workspace_service.sync_manifest_operation_summary` shall never move the project workflow stage backwards. A requested stage lower than the stored stage shall be ignored, so the stored stage remains the highest completed milestone and cannot contradict completed downstream operation summaries. Workflow controllers shall use this canonical promotion-only path instead of assigning a stage directly.
"""

verification = "Automated: Project Lifecycle selectors cover stage promotion, ignored regression, completed downstream-summary preservation, and manifest self-consistency; a workflow-controller selector verifies that the canonical path preserves a completed downstream stage and summaries when a controller requests a lower stage."

affected_paths = [
  "04_Software/AudioMancer/src/audiomancer/services/project_workspace_service.py",
  "04_Software/AudioMancer/src/audiomancer/ui/controllers/workflow_controller_service.py",
]
linked_tests = [
