title = "Preserve completed chunks during interrupted batch translation"
status = "active"

requirement = """
When the main batch translation operation is cancelled or fails, AI Translation shall preserve every previously completed chunk without persisting partial text for the interrupted chunk.
"""

verification = "Automated service tests interrupt the main batch after completed work and after a paid partial segment, then observe completed chunks, accrued usage, no partial current chunk, and the appropriate resumable cancelled or failed status."

