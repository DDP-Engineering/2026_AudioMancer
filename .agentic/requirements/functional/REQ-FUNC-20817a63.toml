# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-20817a63"

title = "Backend probing shall associate discovered context with the exact model"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When the effective selected backend model advertises a valid context window, backend probing shall return that value with the exact model identifier that owns it.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Automated: mock generic OpenAI-compatible, LM Studio native, and Ollama metadata responses and verify only a positive bounded context value for the exact effective model is returned with its owner identifier."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/ai_backend_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_ai_backend_service.py::test_probe_profile_discovers_generic_inline_context_for_exact_model",
  "05_Software/AudioMancer/tests/test_ai_backend_service.py::test_probe_profile_discovers_lm_studio_loaded_instance_context",
  "05_Software/AudioMancer/tests/test_ai_backend_service.py::test_probe_profile_uses_lm_studio_model_context_limit_without_loaded_match",
  "05_Software/AudioMancer/tests/test_ai_backend_service.py::test_lm_studio_optional_metadata_failure_preserves_model_success",
  "05_Software/AudioMancer/tests/test_ai_backend_service.py::test_probe_profile_posts_exact_ollama_model_for_context",
  "05_Software/AudioMancer/tests/test_ai_backend_service.py::test_probe_profile_ignores_invalid_context_metadata",
  "05_Software/AudioMancer/tests/test_ai_backend_service.py::test_probe_profile_does_not_claim_context_for_a_different_model",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = "specs/REQ-FUNC-20817a63.md"

