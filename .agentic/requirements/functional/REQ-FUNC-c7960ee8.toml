title = "Select legacy text encodings deterministically"
status = "active"

requirement = """
When a supported text source has no usable signature or format declaration and is not strict UTF-8, Text Extraction shall select cp1250, cp1251, or cp1252 deterministically from decoded-text evidence before using its explicit Latin-1 terminal fallback.
"""

verification = "Public Extraction tests produce exact canonical Unicode and truthful ledger encodings for UTF-8, UTF-8 BOM, cp1250, cp1251, and cp1252 TXT sources, honor an RTF code-page declaration, and prove the documented Latin-1 terminal case."

