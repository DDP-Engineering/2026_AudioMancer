title = "Honor EPUB content document encodings"
status = "active"

requirement = """
For every non-navigation EPUB spine document, Text Extraction shall decode visible text from its byte-order mark or valid XML/HTML encoding declaration, using deterministic fallback only when none is usable and identifying the item when declared decoding cannot be completed.
"""

