# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-3278aae6"

title = "Selecting the stored source is an idempotent no-op"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When an operator selects the source file already registered in an active project, source import shall return the existing source-document record without copying, deleting, renaming, or changing source metadata.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Focused import and Home-controller tests select equivalent resolved paths and prove the project tree, manifest bytes, compact summaries, artifacts, and workflow stage remain unchanged; different same-named external sources and replacement safeguards remain covered."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "04_Software/AudioMancer/src/audiomancer/services/import_service.py",
  "04_Software/AudioMancer/src/audiomancer/ui/controllers/home_ui_controller.py",
  "04_Software/AudioMancer/tests/test_import_service.py",
  "04_Software/AudioMancer/tests/test_home_ui_controller.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "04_Software/AudioMancer/tests/test_import_service.py::test_import_source_reselects_existing_project_copy_without_mutation",
  "04_Software/AudioMancer/tests/test_import_service.py::test_import_source_replaces_with_different_external_file_of_same_name",
  "04_Software/AudioMancer/tests/test_import_service.py::test_import_source_copy_failure_preserves_complete_previous_project_state",
  "04_Software/AudioMancer/tests/test_import_service.py::test_import_source_rejects_previous_source_traversal_path",
  "04_Software/AudioMancer/tests/test_import_service.py::test_import_source_avoids_reserved_generated_artifact_names",
  "04_Software/AudioMancer/tests/test_home_ui_controller.py::test_home_ui_controller_reselects_stored_source_without_reset",
  "04_Software/AudioMancer/tests/test_home_ui_controller.py::test_home_ui_controller_replaces_processed_source_as_one_consistent_reset",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"
rationale = "Selecting the visible project copy must not silently duplicate large sources or invalidate completed work."

created = 2026-08-07
updated = 2026-08-07
