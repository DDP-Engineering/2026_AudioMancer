# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-9b951004"

title = "Character Discovery shall persist rejected-candidate diagnostics"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When Character Discovery rejects merged candidates for missing evidence or
spoken-dialogue evidence, the service shall strictly persist one deterministic,
credential-free diagnostic per rejected identity and reason across interruption,
resume, and completion, and shall project its count as the operation warning
count.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Service, state, manifest, and export tests interrupt and repeatedly resume one run with rejected candidates, prove the strict persisted diagnostics retain their names, allowed reasons, and counts without duplicated identities, and prove the page notes, manifest summary, and exported warning count match the same unique diagnostic count. Strict fixtures reject extra fields, unsupported reason tokens, blank names, and invalid diagnostic counts."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "04_Software/AudioMancer/src/audiomancer/services/character_discovery_service.py",
  "04_Software/AudioMancer/src/audiomancer/services/character_discovery_state_service.py",
  "04_Software/AudioMancer/src/audiomancer/services/project_export_service.py",
  "04_Software/AudioMancer/src/audiomancer/services/ui_state_service.py",
  "04_Software/AudioMancer/tests/test_character_discovery_service.py",
  "04_Software/AudioMancer/tests/test_character_discovery_state_service.py",
  "04_Software/AudioMancer/tests/test_project_export_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "04_Software/AudioMancer/tests/test_character_discovery_service.py::test_rejected_candidate_diagnostics_survive_repeated_synthesis_resume",
  "04_Software/AudioMancer/tests/test_character_discovery_service.py::test_character_discovery_strictly_rejects_new_profile_and_window_contract_fields",
  "04_Software/AudioMancer/tests/test_character_discovery_state_service.py::test_character_state_projects_rejected_candidate_warning_count",
  "04_Software/AudioMancer/tests/test_character_discovery_state_service.py::test_resumable_character_state_projects_persisted_rejection_notes",
  "04_Software/AudioMancer/tests/test_project_export_service.py::test_project_export_service_reports_character_rejection_warning_count",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = "specs/REQ-FUNC-9b951004.md"

priority = "normal"   # low | normal | high
rationale = "Operators need a durable, privacy-preserving explanation when a discovered candidate is excluded from the speaking-character inventory."

