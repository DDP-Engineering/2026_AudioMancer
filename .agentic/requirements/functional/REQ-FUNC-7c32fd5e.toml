# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-7c32fd5e"

title = "Validate every opened Audio Assembly source"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When an included non-pause source is required for Audio Assembly, the service shall reject a missing, unsafe, unsupported or incomplete WAV with the affected Speech Block ID before publishing any output.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Remove or truncate an approved spoken WAV and verify a block-specific preflight error and absent output, while metadata pauses and disabled ambience remain usable."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = ["05_Software/AudioMancer/src/audiomancer/services/audio_assembly_service.py", "05_Software/AudioMancer/src/audiomancer/services/audio_assembly_wav.py", "05_Software/AudioMancer/src/audiomancer/services/audio_blocks_artifact_service.py"]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_rejects_incompatible_later_output_before_publication",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_rejects_incomplete_required_speech",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_requires_missing_generated_ambience_only_when_included",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_reference_params_accepts_a_narrow_path_resolver",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_reference_params_resolves_default_path_at_call_time",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_service_writes_pause_blocks_as_silence",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_service_preflights_included_legacy_scene_ambience_source",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_service_composes_valid_legacy_scene_ambience_source",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_service_ignores_invalid_legacy_scene_ambience_when_disabled",
  "05_Software/AudioMancer/tests/test_audio_assembly_service.py::test_audio_assembly_service_final_assembly_uses_mixed_scene_ambience_group",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "The composition boundary must defend against legacy or corrupt rows even when current Audio Blocks loading normally keeps metadata-only ambience pathless."

created = 2026-08-09
updated = 2026-11-10
