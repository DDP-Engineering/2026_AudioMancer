title = "Audio Blocks retains the actual synthesis identity of a playable WAV"
status = "active"

requirement = """
When a playable completed WAV has changed synthesis inputs, Audio Blocks shall retain its original generation fingerprint and show the existing audio as stale for operator review when the current inputs can be resolved.
"""

verification = "Change a block input and verify the prior file, approval and fingerprint plus the stale indicator. Verify different cached and effective token budgets alone do not produce a stale badge, and restoring configured inputs clears their marker."

