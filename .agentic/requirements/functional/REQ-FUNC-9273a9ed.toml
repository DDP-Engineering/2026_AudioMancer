# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-9273a9ed"

title = "Derive provider chat and model endpoints uniformly"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When chat generation and OpenAI-compatible model probing derive endpoints from a provider base URL, AudioMancer shall use one shared URL-joining policy that inserts exactly one `/v1` segment while preserving proxy prefixes, queries, and the established fragment behavior.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Table-driven regressions prove matching `/v1/chat/completions` and `/v1/models` derivation for empty, root, trailing-slash, existing-version, proxy-prefix, query-bearing, duplicate-version, and fragment-bearing bases, while request-level tests prove generation and Test Connection use those URLs."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "04_Software/AudioMancer/src/audiomancer/services/ai_backend_service.py",
  "04_Software/AudioMancer/src/audiomancer/services/llm_provider_service.py",
  "04_Software/AudioMancer/src/audiomancer/services/url_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "04_Software/AudioMancer/tests/test_ai_backend_service.py::test_openai_compatible_model_probe_uses_shared_versioned_derivation",
  "04_Software/AudioMancer/tests/test_llm_provider_service.py::test_build_chat_endpoint_uses_shared_versioned_derivation",
  "04_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_requests_the_shared_versioned_endpoint",
  "04_Software/AudioMancer/tests/test_settings_service.py::test_validate_settings_preserves_query_and_fragment_provider_base_url",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"
rationale = "Generation and Test Connection must interpret one persisted provider base URL identically."

created = 2026-08-09
updated = 2026-08-09
