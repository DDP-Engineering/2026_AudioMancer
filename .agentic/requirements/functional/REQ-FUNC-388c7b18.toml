id = "REQ-FUNC-388c7b18"
title = "The provider client shall back off between retryable outer attempts"
status = "active"

requirement = """
After a retryable transient provider failure with another configured outer attempt remaining, the provider client shall wait using a bounded exponential schedule of 0.5 seconds for the first retry, 1.0 second for the second, doubling thereafter to a 4.0-second per-wait cap while polling cooperative cancellation at short intervals. It does not wait after permanent failures, compatibility adaptation, or the final attempt; cancellation before or during the wait raises OperationCancelledError promptly and prevents another provider request; and response-pending cancellation retains its existing behavior.
"""

verification = "Automated: controlled waits verify the exact 0.5, 1.0, 2.0, 4.0, 4.0 schedule, no waits for permanent failures, immediate compatibility adaptation, or the final failed attempt, prompt cancellation before and during backoff, no dispatch after cancellation, and retained transient-retry success and response-pending cancellation."

