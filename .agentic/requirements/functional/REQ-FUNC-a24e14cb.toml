schema = 1
id = "REQ-FUNC-a24e14cb"
title = "Cancel cancellable VoiceWeaver operations remotely"
status = "active"

requirement = """
When local cancellation is requested while the VoiceWeaver operation advertises `cancellable = true`, AudioMancer shall submit `POST /cancel` before ending its polling wait, reading the operation once when the cancellation arrives before the first status poll, and shall still end that wait as a cancellation when the `POST /cancel` request itself fails.
"""

verification = "Focused polling tests report a running cancellable operation and request local cancellation before the first poll, between polls, and while `POST /cancel` raises a dropped connection, observing one `/cancel` request and the cancellation exception in each case."

affected_paths = [
  "04_Software/AudioMancer/src/audiomancer/services/audio_blocks_service.py",
  "04_Software/AudioMancer/src/audiomancer/services/voiceweaver_runtime_service.py",
  "04_Software/AudioMancer/src/audiomancer/ui/controllers/tts_runtime_ui_support.py",
]
linked_tests = [
  "04_Software/AudioMancer/tests/test_voiceweaver_runtime_service.py::test_wait_for_terminal_operation_posts_cancel_for_cancellable_runtime_operation",
  "04_Software/AudioMancer/tests/test_voiceweaver_runtime_service.py::test_wait_for_terminal_operation_posts_cancel_when_requested_after_status_read",
  "04_Software/AudioMancer/tests/test_voiceweaver_runtime_service.py::test_wait_for_terminal_operation_cancels_remotely_when_cancelled_before_the_first_poll",
  "04_Software/AudioMancer/tests/test_voiceweaver_runtime_service.py::test_wait_for_terminal_operation_keeps_cancellation_when_remote_cancel_drops_the_connection",
]

priority = "high"
rationale = """
Sound generation is the one operation the runtime can interrupt, and it is also the one that keeps a GPU busy after AudioMancer has stopped waiting, so a cancel that never reaches the runtime is refused as `busy` on the next attempt. A runtime torn down mid-cancel closes the connection instead of answering, which must not turn the operator's own Cancel into a failure.
"""
created = 2026-07-19
updated = 2026-08-22
