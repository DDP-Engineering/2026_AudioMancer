# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-75d5b274"

title = "Completed Cleanup reruns shall reset artifacts before starting"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When an operator confirms rerunning completed Cleanup, the application shall
reset Cleanup and every downstream artifact and compact manifest summary through
the canonical Cleanup reset transition before it starts the new Cleanup worker.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Controller tests prove that declining changes neither files nor manifest and starts no worker, while accepting resets the Cleanup and representative downstream artifacts and summaries, installs the returned manifest before start_operation, and causes the worker to receive that reset manifest rather than returning the completed-document cache result; a reset failure starts no worker."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/ui/controllers/text_cleanup_ui_controller.py",
  "05_Software/AudioMancer/src/audiomancer/services/text_cleanup_state_service.py",
  "05_Software/AudioMancer/tests/test_text_cleanup_ui_controller.py",
  "05_Software/AudioMancer/tests/test_text_cleanup_state_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_text_cleanup_ui_controller.py::test_completed_cleanup_rerun_decline_keeps_manifest_and_starts_no_worker",
  "05_Software/AudioMancer/tests/test_text_cleanup_ui_controller.py::test_completed_cleanup_rerun_resets_before_starting_with_reset_manifest",
  "05_Software/AudioMancer/tests/test_text_cleanup_ui_controller.py::test_completed_cleanup_rerun_reset_failure_starts_no_worker",
  "05_Software/AudioMancer/tests/test_text_cleanup_state_service.py::test_cleanup_reset_removes_artifacts_and_forces_fresh_analysis",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "A destructive-rerun confirmation must accurately describe the transition that follows."

created = 2026-08-04
updated = 2026-08-04
