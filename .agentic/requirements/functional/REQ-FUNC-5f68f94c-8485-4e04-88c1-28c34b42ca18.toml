requirement = "Audio Assembly shall reject 8-bit PCM WAV sources instead of rendering them, because it treats all sample widths as signed and unsigned 8-bit silence would be written as a DC offset."
rationale = "8-bit was listed as a supported width while _write_silence emitted 0x00 and pcm_codec read one-byte samples as signed, so gaps and pauses in an 8-bit render would be an audible DC click rather than silence. The TTS pipeline emits 16-bit, so the width was a false capability claim rather than a used path."
verification = "Automated: pytest selectors asserting an 8-bit source is rejected with the unsupported-PCM error, that 16-bit still passes validation, and that gap silence stays zero-filled and frame-exact."
