schema = 1
id = "REQ-FUNC-2ab78634"
title = "Cleanup publication shall invalidate every downstream operation coherently"
status = "active"

requirement = """
Whenever an automatic Cleanup run or rerun, or an operator's manual cleaned-text
save, successfully publishes a new canonical `clean_text.txt`, the same logical
transition shall delete the artifacts owned by Chunking and every downstream
operation through the centralized operation-reset mechanism and reset those
operations' compact `project.json` summaries to their default not-started state.

The transition shall retain the completed Cleanup artifact and summary, set
`current_stage` to `text_chunking_ready`, and preserve the source document,
completed Extraction state and artifacts, project options, and all other
unrelated manifest fields. Reopening the successfully updated project shall not
request metadata repair because of the invalidated downstream summaries.

Any failure while persisting the Cleanup artifacts or synchronized manifest
shall propagate to the caller, and the Cleanup operation shall not report a
successful transition after that failure.
"""

verification = "The automatic-publication and manual-edit regression tests start with completed downstream summaries plus real downstream files, then prove those files and summaries are reset while Cleanup, source, Extraction, options, and text_chunking_ready survive a clean reopen; the parameterized persistence-failure regression proves both paths propagate the manifest write error and automatic progress never reports 100 percent."

