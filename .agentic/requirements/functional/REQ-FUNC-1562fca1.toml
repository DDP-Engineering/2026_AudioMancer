schema = 1
id = "REQ-FUNC-1562fca1"
title = "Send generation requests using the simplified VoiceWeaver contract"
status = "active"

requirement = """
When AudioMancer requests voice design, direct clone, clone-prompt creation, clone-from-prompt generation, or sound generation, it shall use the documented unversioned route and exact required fields, naming the selected language only when the runtime offers that language and omitting the language field otherwise, and shall keep every field within the range the runtime accepts so that no request is refused for a value AudioMancer chose.
"""

verification = "Focused runtime-service tests capture every generation request and compare its route, content type, and fields with the simplified VoiceWeaver REST contract, including one request whose selected language is Romanian and one whose selected language is outside the model's reported supported list, both of which carry no language field, and one sound request whose requested duration exceeds the model's output ceiling and is submitted at the ceiling; settings and TTS Settings tests confirm no out-of-range duration can be configured in the first place."

