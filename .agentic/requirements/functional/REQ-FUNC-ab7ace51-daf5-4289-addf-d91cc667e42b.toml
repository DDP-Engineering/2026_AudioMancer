requirement = "Each application run shall write to a log file whose name is unique per process, so a concurrent start cannot truncate another run's log."
rationale = "The name used second granularity while the handler opened with mode='w', so two starts within the same second resolved to the same path and the second truncated the first, destroying diagnostics precisely when two instances were running."
verification = "Automated: a pytest selector asserting two process ids at one fixed timestamp yield distinct log paths that keep the app-name prefix, date, time and .log suffix."
