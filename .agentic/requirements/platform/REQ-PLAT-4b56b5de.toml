# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/AudioMancer/tests/test_settings_service.py::test_validate_settings_preserves_valid_reasoning_mode",
    "05_Software/AudioMancer/tests/test_settings_service.py::test_validate_settings_repairs_invalid_reasoning_mode",
    "05_Software/AudioMancer/tests/test_settings_service.py::test_build_default_settings_includes_book_analysis_profile_default",
    "05_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_applies_reasoning_mode_without_model_name_gating",
    "05_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_provider_default_omits_reasoning_control",
    "05_Software/AudioMancer/tests/test_llm_provider_service.py::test_chat_json_retries_provider_default_when_reasoning_control_is_rejected",
    "05_Software/AudioMancer/tests/test_ai_settings_page.py::test_ai_settings_page_round_trips_reasoning_and_book_analysis_default",
]

