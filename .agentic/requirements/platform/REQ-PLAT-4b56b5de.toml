# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "LM Studio and compatible servers expose many model families; a model-name allowlist would make reasoning control brittle and unnecessarily vendor-specific."

