requirement = "The application shall resolve one writable data root by taking the AUDIOMANCER_DATA_DIR override first, then the application root when a probe file proves it accepts writes and it is not the PyInstaller extraction directory, and otherwise the per-user OS data location for the running platform."
rationale = "A frozen build installed into Program Files or a system-wide Linux prefix cannot write under the application root, so writable data needs a resolved location that stays next to the application whenever that is actually possible."
verification = "Automated: 10 linked pytest selectors covering the override, blank-override skip, writable portable root, non-directory root, Windows LOCALAPPDATA and APPDATA fallbacks, Linux XDG_DATA_HOME and ~/.local/share fallbacks, macOS Application Support, and _MEIPASS rejection."
spec_ref = ".agentic/specs/user_data_location.spec.md"

