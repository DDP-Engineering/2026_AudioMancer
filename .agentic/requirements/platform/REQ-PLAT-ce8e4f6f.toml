# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-PLAT-ce8e4f6f"

title = "Fresh settings shall use config-defined factory defaults"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When settings are created or an invalid supported value is repaired, the application shall use the config-defined factory defaults for the default AI chunking strategy and completion beep. The shipped settings scaffold carries those same factory values, while valid persisted operator choices remain authoritative.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Automated tests compare built-in defaults and the committed scaffold with the two config constants, exercise repair and fallback paths, and confirm valid persisted scene/true choices are unchanged."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/settings.example.json",
  "05_Software/AudioMancer/src/audiomancer/config.py",
  "05_Software/AudioMancer/src/audiomancer/services/settings_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_settings_service.py::test_build_default_settings_uses_config_defined_factory_defaults",
  "05_Software/AudioMancer/tests/test_settings_service.py::test_committed_settings_example_uses_config_defined_factory_defaults",
  "05_Software/AudioMancer/tests/test_settings_service.py::test_validate_settings_preserves_valid_explicit_scene_and_enabled_beep",
  "05_Software/AudioMancer/tests/test_settings_service.py::test_load_settings_self_heals_missing_and_invalid_values",
  "05_Software/AudioMancer/tests/test_settings_service.py::test_ensure_settings_file_seeds_from_the_bundled_default",
  "05_Software/AudioMancer/tests/test_settings_service.py::test_ensure_settings_file_falls_back_when_the_bundled_default_is_unusable",
  "05_Software/AudioMancer/tests/test_settings_service.py::test_ensure_settings_file_uses_defaults_when_the_active_path_is_the_bundled_path",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "normal"   # low | normal | high
rationale = """
One source of truth prevents first-run, fallback, and repair behavior from drifting away from the application defaults without rewriting explicit valid operator settings.
"""

created = 2026-08-08
updated = 2026-08-08
