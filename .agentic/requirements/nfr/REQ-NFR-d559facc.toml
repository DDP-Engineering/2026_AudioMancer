# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-NFR-d559facc"

title = "Shared LLM selector construction shall preserve caller contracts"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
The shared LLM profile-selector builder shall preserve each participating caller's enabled-profile filtering, label normalization, explicit-selection precedence, configured-default fallback, first-enabled fallback, and empty-state result.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "Focused state-service tests exercise invalid payloads, disabled and malformed profiles, whitespace labels, explicit selections, configured defaults, first-enabled fallback, empty results, narrator readiness, and the distinct Cleanup label contract through every participating public wrapper."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/ai_state_note_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/ai_translation_state_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/character_discovery_state_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/narrator_definition_state_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/speech_blocks_state_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/text_chunking_state_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_ai_state_note_service.py::test_build_llm_profile_selector_state_preserves_filtering_and_precedence",
  "05_Software/AudioMancer/tests/test_ai_state_note_service.py::test_build_llm_profile_selector_state_returns_empty_for_invalid_payloads",
  "05_Software/AudioMancer/tests/test_ai_state_note_service.py::test_llm_profile_selector_wrappers_preserve_default_and_selection_contracts",
  "05_Software/AudioMancer/tests/test_text_cleanup_state_service.py::test_ai_cleanup_profile_state_preserves_nonempty_whitespace_label",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "normal"   # low | normal | high
rationale = "Consolidating only behavior-equivalent selectors prevents selection rules from drifting without normalizing Cleanup's distinct whitespace-label behavior."

created = 2026-08-09
updated = 2026-08-09
