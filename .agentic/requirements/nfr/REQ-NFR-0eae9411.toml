# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "normal"   # low | normal | high
rationale = "One exact construction point prevents destructive confirmations from drifting while distinct overloads, formatted messages, and default-Yes dialogs remain local."

