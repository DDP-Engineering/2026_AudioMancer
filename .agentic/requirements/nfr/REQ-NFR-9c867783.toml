# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-NFR-9c867783"

title = "Resolve Speech Block source context once per operation"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
During one public Speech Blocks read or mutation entry point, the service shall resolve upstream source chunks at most once while retaining the same report and operation-state counts when upstream artifacts are available or unavailable.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Instrumented regressions call repeated read, approve, edit, insert, and delete entry points and observe no more than one source-resolution call per entry point with unchanged projection counts and unavailable-source fallbacks; original-language and approved-translated page reads each observe exactly one underlying chunking-document read and one translation-document read."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/speech_blocks_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/speech_blocks_state_service.py",
  "05_Software/AudioMancer/tests/test_speech_blocks_service.py",
  "05_Software/AudioMancer/tests/test_speech_blocks_state_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_speech_blocks_service.py::test_public_review_operations_resolve_source_chunks_at_most_once",
  "05_Software/AudioMancer/tests/test_speech_blocks_service.py::test_review_update_preserves_projection_counts_when_source_resolution_is_unavailable",
  "05_Software/AudioMancer/tests/test_speech_blocks_service.py::test_start_generation_splits_same_narrator_without_calling_a_model",
  "05_Software/AudioMancer/tests/test_speech_blocks_state_service.py::test_build_speech_blocks_state_resolves_source_chunks_once",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "A review click must not synchronously parse the complete chunking and translation corpus several times through nested projection helpers."

created = 2026-08-09
updated = 2026-08-09
