id = "REQ-UX-da3b47c4"
title = "Contain expected project workspace failures at the Home UI boundary"
status = "active"

requirement = """
When project creation, opening, confirmed repair, or source import raises OSError or ValueError, the Home controller shall show the existing localized project-error warning with the original error text and leave the active project state and success notifications unchanged.
"""

verification = "Focused controller tests inject OSError subclasses at the create, import, repair, and open boundaries plus ValueError during open, then assert the localized warning title and original text are shown without project activation, manifest replacement, or success notification."

affected_paths = [
  "04_Software/AudioMancer/src/audiomancer/ui/controllers/home_ui_controller.py",
]
linked_tests = [
  "04_Software/AudioMancer/tests/test_home_ui_controller.py::test_home_ui_controller_shows_warning_for_open_project_error",
  "04_Software/AudioMancer/tests/test_home_ui_controller.py::test_home_ui_controller_contains_project_creation_filesystem_error",
  "04_Software/AudioMancer/tests/test_home_ui_controller.py::test_home_ui_controller_contains_source_import_filesystem_error",
  "04_Software/AudioMancer/tests/test_home_ui_controller.py::test_home_ui_controller_contains_confirmed_repair_filesystem_error",
]

priority = "high"
rationale = """
ValueError indicates invalid project content and OSError indicates filesystem access failure; both are recoverable operator-facing failures that must not escape the Qt slot without feedback.
"""
