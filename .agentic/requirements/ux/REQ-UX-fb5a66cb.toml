schema = 1
id = "REQ-UX-fb5a66cb"
title = "The Character Voices editor shall block an out-of-range preview text"
status = "active"

requirement = """
If an operator saves a character voice whose edited preview text falls outside the accepted voice-clone word range, then the Character Voices page shall abandon the save and show a localized dialog stating the accepted range and the current word count.
"""

verification = "A focused controller test requests a character prompt save carrying preview text below the accepted minimum, then observes that no target write is attempted and that a warning dialog is shown carrying the localized out-of-range message with the accepted bounds and the supplied word count filled in."

affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/ui/controllers/character_voices_ui_controller.py",
  "05_Software/AudioMancer/src/audiomancer/services/ui_state_service.py",
]
linked_tests = [
  "05_Software/AudioMancer/tests/test_character_voices_ui_controller.py::test_character_voices_ui_controller_save_blocks_out_of_range_preview_text",
]

spec = ""

priority = "high"
rationale = """
A character sample is recorded from this text exactly as a narrator sample is, and a too-short one produces a weak clone whose failure is invisible until generated speech is auditioned much later. The Character Voices editor previously accepted any non-empty text, so the operator had no way to learn the length mattered.
"""
created = 2026-08-20
updated = 2026-08-20
