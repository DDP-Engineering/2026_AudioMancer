spec = ""
priority = "high"
rationale = """
The status text is read against what the page shows, so a dialog that blocked the page would defeat its own purpose. Modelessness also keeps this dialog clear of the operation-progress dialog, which is deliberately application-modal because it owns cancellation of a running operation; these are two different surfaces and only the progress one may seize the shell.
"""

