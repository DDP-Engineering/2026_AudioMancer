schema = 1
id = "REQ-UX-1829f58e"
title = "Pressing the operation-status button shall open the modeless status dialog for the current page"
status = "active"

requirement = """
When the operator presses the operation-status button, the shell shall show a dialog carrying the status text of the current page's workflow operation, and that dialog shall be modeless so the shell and its pages stay usable while it is open.
"""

verification = "Automated: pressing the button on a page whose operation has run shows a visible dialog whose text equals the status text built for that page; the dialog reports no application or window modality; and the shell's current page can still be changed while it is open, after which the dialog carries the new page's status text."

