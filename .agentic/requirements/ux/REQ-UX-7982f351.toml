# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-7982f351"

title = "Expose block-document reset recovery without generation"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
While a Speech Blocks or Audio Blocks authoritative document is corrupt or unreadable, the corresponding workflow page shall present the stage-specific reset recovery instruction, keep explicit reset available, and prevent generation from starting.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "State, controller, and page tests refresh each affected workflow with a corrupt document and verify the recovery text is visible, reset remains enabled, generation is disabled, direct generation requests show the project-error dialog, and no operation starts."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/speech_blocks_state_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/audio_blocks_state_service.py",
  "05_Software/AudioMancer/src/audiomancer/ui/controllers/speech_blocks_ui_controller.py",
  "05_Software/AudioMancer/src/audiomancer/ui/controllers/audio_blocks_ui_controller.py",
  "05_Software/AudioMancer/src/audiomancer/ui/controllers/home_ui_controller.py",
  "05_Software/AudioMancer/src/audiomancer/services/project_export_service.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
  "05_Software/AudioMancer/tests/test_speech_blocks_state_service.py::test_build_speech_blocks_state_surfaces_corrupt_document_as_reset_only_recovery",
  "05_Software/AudioMancer/tests/test_audio_blocks_state_service.py::test_build_audio_blocks_state_surfaces_corrupt_document_as_reset_only_recovery",
  "05_Software/AudioMancer/tests/test_speech_blocks_ui_controller.py::test_speech_blocks_ui_controller_rejects_corrupt_document_before_confirmation",
  "05_Software/AudioMancer/tests/test_audio_blocks_ui_controller.py::test_audio_blocks_ui_controller_rejects_corrupt_document_before_runtime_probe",
  "05_Software/AudioMancer/tests/test_speech_blocks_page.py::test_speech_blocks_page_shows_reset_recovery_without_generation",
  "05_Software/AudioMancer/tests/test_audio_blocks_page.py::test_audio_blocks_page_shows_reset_recovery_without_generation",
  "05_Software/AudioMancer/tests/test_speech_blocks_ui_controller.py::test_speech_blocks_ui_controller_explicit_reset_clears_speech_blocks_and_downstream",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "Recovery must be explicit and operator-visible before expensive generation can replace damaged work."

