schema = 1
id = "REQ-UX-3cdcb2a3"
title = "The narrator editor shall block an out-of-range preview text"
status = "active"

requirement = """
If an operator saves a narrator profile whose edited preview text falls outside the accepted narrator preview word range, then the Narator Voice page shall abandon the save and show a localized dialog stating the accepted range and the current word count.
"""

verification = "A focused controller test requests a profile save carrying preview text below the accepted minimum, then observes that no profile write is attempted and that a warning dialog is shown carrying the localized out-of-range message with the accepted bounds and the supplied word count filled in."

affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/ui/controllers/narator_voice_ui_controller.py",
  "05_Software/AudioMancer/src/audiomancer/services/narrator_definition_service.py",
  "05_Software/AudioMancer/src/audiomancer/services/ui_state_service.py",
]
linked_tests = [
  "05_Software/AudioMancer/tests/test_narator_voice_ui_controller.py::test_narator_voice_save_blocks_out_of_range_preview_text",
  "05_Software/AudioMancer/tests/test_narator_voice_ui_controller.py::test_narator_voice_save_blocks_cleared_preview_text",
]

spec = ""

priority = "high"
rationale = """
A hand-written preview shorter than the accepted range produces an unusable cloning reference, and the failure is invisible until the operator listens to generated speech much later. Reporting the range at save time is the only point where the correction is cheap. A cleared box is treated the same way rather than being quietly refilled with the default, because the editor already opens preloaded with that default, so an empty box can only mean the operator deleted it.
"""
created = 2026-08-20
updated = 2026-08-20
