schema = 1
id = "REQ-UX-8e33d3cf"
title = "The Settings page shall select themes from the merged catalog"
status = "active"

requirement = """
When settings are loaded, the Settings page shall rebuild its theme selector from the normalized merged theme catalog and use that collection for selection, persistence, preview, and relabeling. Built-in themes appear first with localized labels, followed by valid custom themes whose operator-authored display names remain unchanged. Saving without a theme change preserves the selected custom ui_theme_id and the existing ui_themes payload, while repeated loads remove stale entries and do not create duplicates.
"""

verification = "Focused Settings-page tests load built-in and valid custom themes, assert catalog order and invalid-theme filtering, round-trip an unchanged custom selection without altering ui_themes, inspect the custom preview stylesheet, preserve custom display names while translating built-ins, and confirm repeated loads contain no stale or duplicate entries."

affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/ui/pages/settings_page.py",
]
linked_tests = [
