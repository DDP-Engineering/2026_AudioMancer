title = "In the theme stylesheet, QPushButton and the single-line input controls"
status = "active"

requirement = """
In the theme stylesheet, QPushButton and the single-line input controls QLineEdit, QComboBox, QSpinBox and QDoubleSpinBox shall use a border-radius of at least 6px, the theme panel_background background and text_primary text.
"""

verification = "uv run pytest -q 05_Software/AudioMancer/tests/test_ui_state_service.py::test_theme_stylesheet_controls_use_rounded_corners (passed)"

affected_paths = [
  "05_Software/AudioMancer/src/audiomancer/services/ui_state_service.py",
]
linked_tests = [
  "05_Software/AudioMancer/tests/test_ui_state_service.py::test_theme_stylesheet_controls_use_rounded_corners",
]

priority = "normal"
rationale = """
Consistent rounded corners on buttons and inputs match the card language and the brand. QDoubleSpinBox is a QAbstractSpinBox sibling of QSpinBox, not a subclass of it, so a selector list naming QSpinBox alone leaves QDoubleSpinBox unstyled - which showed up as the AI Settings Temperature field rendering with native grey chrome against the theme's light text color.
"""
