# Codex project configuration for the manual agentic workflow.
# Keep this file free of secrets.

# Selects the named permission profile below for generated projects.
default_permissions = "agentic-workspace"

# Workspace-scoped profile used by Codex after the template is copied to a
# target repository root.
sandbox_mode = "danger-full-access"
[permissions.agentic-workspace]
description = "Workspace-scoped editing for manual agentic development."
extends = ":workspace"

# Offline-first default. Enable only when the target project explicitly needs
# network access and the human approves it. Configured outward-delivery policy
# is evaluated by `.agentic/hooks/delivery_preflight.py`; Codex approvals are a
# separate host safety layer.
[permissions.agentic-workspace.network]
enabled = false
