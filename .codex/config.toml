# Codex project configuration for the manual agentic workflow.
# Keep this file free of secrets.

# Selects the named permission profile below for generated projects.
default_permissions = "agentic-workspace"

# Workspace-scoped profile used by Codex after the template is copied to a
# target repository root.
[permissions.agentic-workspace]
description = "Workspace-scoped editing for manual agentic development."
extends = ":workspace"

# Root-relative filesystem grants. Keep secret-like files denied even when the
# workspace itself is writable.
[permissions.agentic-workspace.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
".codex" = "read"
".agentic" = "write"
"**/*.env" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/*_rsa" = "deny"
"**/*_rsa.pub" = "deny"

# Offline-first default. Enable only when the target project explicitly needs
# network access and the human approves it. Outward delivery (push, PR, merge)
# is additionally gated by the shared `.agentic/hooks/delivery_preflight.py`
# hook and always requires explicit human approval, matching the Claude Code
# deny list in `.claude/settings.json`.
[permissions.agentic-workspace.network]
enabled = false
